info:
  name: "LoginAsSystemAdmin "
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:6000/api/v1/auth/login
  body:
    type: json
    data: |-
      {
        "email": "{{admin_user}}",
        "password": "{{admin_password}}"
      } 
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: admin_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
