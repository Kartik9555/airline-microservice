services:
  user-db:
    image: postgres:14.1-alpine
    container_name: user-db
    mem_reservation: 256m
    mem_limit: 512m
    cpus: 0.5
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=yt_airline_user_db
    ports:
      - '3302:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yt_airline_user_db -h localhost -p 5432"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - "./volumes/db/data/userdb:/var/lib/postgresql/data"
