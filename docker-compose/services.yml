  service-registry:
    image: kartik9555/service-registry:latest
    container_name: service-registry
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
#    depends_on:
#      config-server:
#        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=service-registry
#      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseG1GC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - airline-microservices
  user-service:
    image: kartik9555/user-service:latest
    container_name: user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      service-registry:
        condition: service_healthy
#      config-server:
#        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=user-service
#      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/postgres?currentSchema=yt_airline_user_db&binaryTransfer=true&reWriteBatchedInserts=true
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=org.postgresql.Driver
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseG1GC
    networks:
      - airline-microservices
