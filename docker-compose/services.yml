      - "5001:5001"
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=user-service
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
