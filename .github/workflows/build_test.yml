name: Incremental CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      modules: ${{ steps.modules.outputs.modules }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'common/**'

            api-gateway:
              - 'cloud/api-gateway/**'

            config-server:
              - 'cloud/config-server/**'

            service-registry:
              - 'cloud/service-registry/**'

            airline-core-service:
              - 'services/airline-core-service/**'

            ancillary-service:
              - 'services/ancillary-service/**'

            booking-service:
              - 'services/booking-service/**'

            flight-ops-service:
              - 'services/flight-ops-service/**'

            location-service:
              - 'services/location-service/**'

            notification-service:
              - 'services/notification-service/**'

            payment-service:
              - 'services/payment-service/**'

            pricing-service:
              - 'services/pricing-service/**'

            seat-service:
              - 'services/seat-service/**'
            
            user-service:
              - 'services/user-service/**'

      - name: Build module matrix
        id: modules
        shell: bash
        run: |
          if [[ "${{ steps.filter.outputs.common }}" == "true" ]]; then
            MODULES='[
              "api-gateway",
              "config-server",
              "service-registry",
              "airline-core-service",
              "ancillary-service",
              "booking-service",
              "flight-ops-service",
              "location-service",
              "notification-service",
              "payment-service",
              "pricing-service",
              "seat-service",
              "user-service"
            ]'
          else
            modules=()

            [[ "${{ steps.filter.outputs.api-gateway }}" == "true" ]] && modules+=('"api-gateway"')
            [[ "${{ steps.filter.outputs.config-server }}" == "true" ]] && modules+=('"config-server"')
            [[ "${{ steps.filter.outputs.service-registry }}" == "true" ]] && modules+=('"service-registry"')
            [[ "${{ steps.filter.outputs.airline-core-service }}" == "true" ]] && modules+=('"airline-core-service"')
            [[ "${{ steps.filter.outputs.ancillary-service }}" == "true" ]] && modules+=('"ancillary-service"')
            [[ "${{ steps.filter.outputs.booking-service }}" == "true" ]] && modules+=('"booking-service"')
            [[ "${{ steps.filter.outputs.flight-ops-service }}" == "true" ]] && modules+=('"flight-ops-service"')
            [[ "${{ steps.filter.outputs.location-service }}" == "true" ]] && modules+=('"location-service"')
            [[ "${{ steps.filter.outputs.notification-service }}" == "true" ]] && modules+=('"notification-service"')
            [[ "${{ steps.filter.outputs.payment-service }}" == "true" ]] && modules+=('"payment-service"')
            [[ "${{ steps.filter.outputs.pricing-service }}" == "true" ]] && modules+=('"pricing-service"')
            [[ "${{ steps.filter.outputs.seat-service }}" == "true" ]] && modules+=('"seat-service"')
            [[ "${{ steps.filter.outputs.user-service }}" == "true" ]] && modules+=('"user-service"')

            if [ ${#modules[@]} -eq 0 ]; then
              MODULES='[]'
            else
              MODULES="[$(IFS=,; echo "${modules[*]}")]"
            fi
          fi

          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "$MODULES"

  build:
    needs: changes

    if: needs.changes.outputs.modules != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Build and test
        run: |
          mvn \
            -B \
            -pl ${{ matrix.module }} \
            -am \
            verify

  docker:
    needs:
      - changes
      - build

    if: needs.changes.outputs.modules != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Cache Jib
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/google-cloud-tools-java
            ~/.config/jib
          key: ${{ runner.os }}-jib-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jib-

      - name: Compute image tag
        id: tag
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image with Jib
        run: |
          mvn \
            -B \
            -pl ${{ matrix.module }} \
            -am \
            -Dimage.tag=${{ steps.tag.outputs.sha }} \
            jib:dockerBuild
