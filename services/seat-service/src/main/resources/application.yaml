server:
  port: 5006
spring:
  application:
    name: seat-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=yt_airline_seat_db&binaryTransfer=true&reWriteBatchedInserts=true
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ALWAYS
      schema-locations: classpath:init-schema.sql
      platform: postgres
  jpa:
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: seat-service-group

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true